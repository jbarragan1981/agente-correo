name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        run: |
          echo "backend=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  lint-y-tipos-backend:
    needs: detectar
    if: needs.detectar.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyrefly check

  pruebas-backend:
    needs: detectar
    if: needs.detectar.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env: { FAKE_PROVIDERS: "true" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --all-extras --group dev
      - run: uv run pytest -q --cov=app --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with: { name: cobertura-backend, path: backend/coverage.xml }

  pruebas-frontend:
    needs: detectar
    if: needs.detectar.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run test -- --run --coverage
      - run: npm run build -- --configuration production

  seguridad:
    needs: detectar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: astral-sh/setup-uv@v6
        if: needs.detectar.outputs.backend == 'true'
      - name: bandit + pip-audit + semgrep
        if: needs.detectar.outputs.backend == 'true'
        working-directory: backend
        run: |
          uv sync --all-extras --group dev
          uv run bandit -q -r app -ll
          uv run pip-audit
          uv run semgrep --config p/owasp-top-ten --config p/python --error app
      - uses: actions/setup-node@v4
        if: needs.detectar.outputs.frontend == 'true'
        with: { node-version: 22 }
      - name: npm audit
        if: needs.detectar.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm audit --audit-level=high

  docs-y-configuracion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar settings, hooks y documentos clave
        run: |
          python3 -m json.tool .claude/settings.json >/dev/null
          for f in .claude/hooks/*.sh; do bash -n "$f"; done
          test -f docs/00-vision-y-alcance.md && test -f CLAUDE.md
