name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ hashFiles('frontend/playwright.config.ts') != '' }}
    runs-on: ubuntu-latest
    env: { FAKE_PROVIDERS: "true" }
    steps:
      - uses: actions/checkout@v4
      - name: Entorno efímero con claves generadas
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import secrets, base64, re, pathlib
          p = pathlib.Path('.env'); s = p.read_text()
          s = re.sub(r'^APP_MASTER_KEY=.*$', 'APP_MASTER_KEY=' + base64.b64encode(secrets.token_bytes(32)).decode(), s, flags=re.M)
          s = re.sub(r'^JWT_SECRET=.*$', 'JWT_SECRET=' + secrets.token_urlsafe(48), s, flags=re.M)
          s = re.sub(r'^FAKE_PROVIDERS=.*$', 'FAKE_PROVIDERS=true', s, flags=re.M)
          p.write_text(s)
          PY
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium && npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report }
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > compose.log; docker compose -f infra/docker-compose.yml down
