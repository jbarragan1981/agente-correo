name: Evaluaciones del clasificador (nocturno)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    if: ${{ hashFiles('evals/dataset.jsonl') != '' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY_STAGING }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --group dev
      - run: uv run python -m evals.clasificador --motor jev --limite 300
      - run: uv run python -m evals.clasificador --motor llm --limite 100
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: reportes-evals, path: evals/reportes }
