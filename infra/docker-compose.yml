name: agente-correo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agente_correo}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"      # solo en desarrollo; en producción eliminar este mapeo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-agente_correo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  api:
    build: { context: .., dockerfile: infra/Dockerfile.backend }
    # Usa el CMD de la imagen (uvicorn --factory app.main:crear_app, sin cabecera Server ni access log).
    # Sin .env la imagen corre con ENV=production y falla cerrada por falta de claves (ADR-0007).
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agente_correo}
      DB_AUTO_CREATE: "true"
      # IP/CIDR del reverse proxy de confianza para X-Forwarded-For; nunca "*".
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/salud/listo', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    # app.worker llega en E1.3; hasta entonces solo se levanta con --profile worker.
    profiles: ["worker"]
    build: { context: .., dockerfile: infra/Dockerfile.backend }
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-agente_correo}
      DB_AUTO_CREATE: "true"
    depends_on: { api: { condition: service_healthy } }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy: { replicas: 1 }

  web:
    # frontend/ se inicializa en E0.4; hasta entonces solo se levanta con --profile web.
    profiles: ["web"]
    build: { context: .., dockerfile: infra/Dockerfile.web }
    depends_on: [api]
    ports: ["127.0.0.1:4200:8080"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  db_data:
