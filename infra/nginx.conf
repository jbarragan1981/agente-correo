# Servidor del panel (contenedor web). ADR-0012: mismo origen que la API y CSP estricta con nonce.
map $http_upgrade $conexion_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API: sin cabeceras del panel; la API envía las suyas (E0.1).
    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Recursos con hash en el nombre: inmutables.
    location ~* \.(?:js|css|woff2?|ico|svg|png|webp)$ {
        try_files $uri =404;
        include /etc/nginx/cabeceras-panel.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html y rutas de la SPA: nonce por petición y sin caché.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/cabeceras-panel.conf;
        add_header Cache-Control "no-store" always;
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter '__CSP_NONCE__' $request_id;
    }
}
