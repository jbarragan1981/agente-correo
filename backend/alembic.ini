# Solo para uso CLI en desarrollo (p. ej. `uv run alembic revision --autogenerate -m "..."`).
# El bootstrap (`python -m app.bootstrap`) no lee este archivo: configura Alembic por código.
# La URL no vive aquí: env.py la toma de Settings (DATABASE_URL_MIGRADOR o DATABASE_URL).
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s
path_separator = os
