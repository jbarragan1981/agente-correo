[project]
name = "agente-correo-backend"
version = "0.1.0"
description = "Backend de Agente Correo (FastAPI + LangGraph + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.31",
  "structlog>=26",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.3,<3.4",
  "procrastinate>=3.10,<3.11",
  "langgraph-checkpoint-postgres>=3.1,<3.2",
  "argon2-cffi>=25.1",
  "uuid-utils>=0.12,<1.0",
  "langchain-core>=1.6,<2",
]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7",
  "httpx>=0.28",
  "testcontainers[postgres]>=4.15",
  "ruff>=0.16",
  "pyrefly>=1.3",
  "bandit>=1.9",
  "pip-audit>=2.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "DTZ", "T20", "BLE",
  "C4", "PIE", "RET", "PTH", "ERA", "TRY", "N",
]
# N818: las excepciones de dominio usan nombres en español (NoEncontrado, ConfiguracionInvalida).
ignore = ["N818"]

[tool.ruff.lint.isort]
# backend/alembic/ es el directorio de migraciones; `alembic` es la librería.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Los validadores de pydantic comunican el error con el mensaje de ValueError.
"app/core/config.py" = ["TRY003"]

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
project-includes = ["app", "tests"]
python-version = "3.12"
search-path = ["."]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
  "unit: sin E/S, puertos falsos",
  "contrato: adaptadores de proveedor con respx/cassettes",
  "integracion: requiere PostgreSQL efímero (ADR-0011)",
  "api: app ASGI con httpx, dependencias falsas",
  "agentes: grafo LangGraph con proveedores falsos",
  "e2e: Compose + Playwright",
  "eval: evaluación del clasificador",
  "lento: > 1 s",
]

[tool.coverage.run]
source = ["app"]
branch = true
